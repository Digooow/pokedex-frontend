name: CI Verification & Docker Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Build, Lint, Typecheck & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client & build shared package
        run: |
          npm run build:shared
          npx --workspace=pokeverse-api prisma generate

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: Lint API
        run: npm run lint:api

      - name: Run unit tests across all workspaces
        run: npm run test

      - name: Run API E2E tests
        env:
          NODE_ENV: test
          API_PORT: 3000
          CORS_ORIGINS: http://localhost:4200,http://127.0.0.1:4200
          APP_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          SESSION_TTL_SEC: 900
          REFRESH_TTL_DAYS: 7
          OTP_TTL_SEC: 600
          OTP_MAX_ATTEMPTS: 3
          COOKIE_SECURE: 'false'
          COOKIE_SAMESITE: lax
          POKEAPI_TIMEOUT_MS: 8000
          MAIL_TRANSPORT: smtp
          SMTP_HOST: 127.0.0.1
          SMTP_PORT: 1025
          SMTP_SECURE: 'false'
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          DATABASE_URL_UNPOOLED: postgresql://ci:ci@127.0.0.1:5432/ci
          REDIS_URL: redis://127.0.0.1:6379
          KAFKA_BROKERS: 127.0.0.1:19092
          S3_ENABLED: 'false'
        run: npm run test:e2e --workspace=pokeverse-api

      - name: Build all workspaces & verify legacy root script
        run: |
          npm run build
          node --check js/app.js

      - name: Run UI Quality Gate (Contrast, Text Fit & Typography)
        run: npm run audit:ui

      - name: Validate production API Docker image build
        run: docker build -f infra/docker/api.Dockerfile -t pokeverse-api:ci .
