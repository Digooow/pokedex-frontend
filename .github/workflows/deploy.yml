name: Cloud Deploy (Azure API + Cloudflare Pages)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  deploy-api-azure:
    name: Deploy API to Azure Container Apps
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_CLOUD_DEPLOY == 'true'
    runs-on: ubuntu-latest
    env:
      ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
      CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      API_FQDN: ${{ vars.AZURE_API_FQDN }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build & Push Docker image to ACR
        run: |
          IMAGE="${ACR_NAME}.azurecr.io/pokeverse-api:${IMAGE_TAG}"
          LATEST="${ACR_NAME}.azurecr.io/pokeverse-api:latest"
          az acr login --name "$ACR_NAME"
          docker build -f infra/docker/api.Dockerfile -t "$IMAGE" -t "$LATEST" .
          docker push "$IMAGE"
          docker push "$LATEST"

      - name: Update Azure Container App
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az extension add --name containerapp --yes
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "${ACR_NAME}.azurecr.io/pokeverse-api:${IMAGE_TAG}"

      - name: Verify API liveness endpoint
        if: env.API_FQDN != ''
        run: curl --fail --retry 5 --retry-delay 5 "https://${API_FQDN}/health/live"

  deploy-web-cloudflare:
    name: Deploy Angular Web to Cloudflare Pages
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_CLOUD_DEPLOY == 'true'
    needs: deploy-api-azure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install & Build Web
        run: |
          npm ci
          npm run build:shared
          npm run build:web

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: pages deploy dist/pokeverse-web/browser --project-name=${{ vars.CF_PAGES_PROJECT }} --branch=main
