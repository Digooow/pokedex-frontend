<figure class="char-holo" [class.is-compact]="compact()">
  <div class="char-holo__viewport" [attr.data-model]="bodyModel()">
    <span class="char-holo__mode">{{ renderModeLabel() }}</span>
    @if (canUseWebGl() && mediaState().kind === 'loading') {
      <span class="char-holo__loading" aria-live="polite">Sincronizando 3D</span>
    }

    <div class="char-holo__scanlines" aria-hidden="true"></div>

    @if (canUseWebGl()) {
      <canvas #glCanvas class="char-holo__canvas">
        Holograma 3D de {{ resolvedName() }}
      </canvas>
    } @else {
      <div class="char-holo__fallback">
        <div class="char-holo__beam" aria-hidden="true"></div>
        <div class="char-holo__pedestal" aria-hidden="true"></div>
        <div class="char-holo__emblem">
          <span class="char-holo__emblem-tag">{{ bodyMeta().label }}</span>
          <strong class="char-holo__emblem-title">Holograma Ativo</strong>
          <span class="char-holo__emblem-sub">{{ origin().startingRegionName }}</span>
        </div>
      </div>
    }
  </div>

  @if (canUseWebGl() && visibleClips().length > 1) {
    <div class="char-holo__clips" aria-label="Animações do personagem">
      @for (clip of visibleClips(); track clip.index) {
        <button
          type="button"
          class="char-holo__clip-btn"
          [attr.aria-pressed]="mediaState().activeAnimationIndex === clip.index"
          (click)="onSelectAnimation(clip.index)"
        >
          {{ clip.label }}
        </button>
      }
    </div>
  }

  @if (canUseWebGl()) {
    <fieldset class="char-holo__controls">
      <legend class="visually-hidden">Controles do holograma 3D</legend>
      <button type="button" class="char-holo__ctrl-btn" (click)="onNudge(-0.45)">Girar ◀</button>
      <button
        type="button"
        class="char-holo__ctrl-btn"
        [attr.aria-pressed]="autoRotate()"
        (click)="onToggleAutoRotate()"
      >
        {{ autoRotate() ? 'Pausar Giro' : 'Auto-Giro' }}
      </button>
      <button type="button" class="char-holo__ctrl-btn" (click)="onNudge(0.45)">Girar ▶</button>
      <button type="button" class="char-holo__ctrl-btn" (click)="onResetCamera()">Resetar</button>
    </fieldset>
  }

  <figcaption class="char-portrait__meta">
    <div class="char-portrait__badges">
      <span class="pv-badge">Sem Nível · Por Treino</span>
      <span class="char-portrait__classless">{{ archetypeLabel() }}</span>
    </div>
    <strong class="char-portrait__name">{{ resolvedName() }}</strong>
    <span class="char-portrait__origin">
      {{ bodyMeta().label }} · {{ origin().label }} · {{ origin().startingRegionName }}
    </span>
  </figcaption>
</figure>
