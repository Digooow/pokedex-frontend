<section class="museum-page" aria-labelledby="main-heading">
  <header class="pv-glass-card museum-page__header">
    <div class="museum-page__copy">
      <span class="pv-badge museum-page__tag">ACESSO PÚBLICO · MÓDULO 02</span>
      <h1 id="main-heading" tabindex="-1" pvMainHeading class="museum-page__title">
        Museu das Regiões &amp; História
      </h1>
      <p class="museum-page__subtitle">
        Atlas histórico das 9 gerações canônicas (1996–2022). Selecione uma região na linha do
        tempo para abrir o dossiê vivo integrado à Pokédex.
      </p>
    </div>

    <a
      [routerLink]="['/pokedex']"
      [queryParams]="{ mode: 'enciclopedia', cat: 'region' }"
      class="pv-btn pv-btn--secondary museum-page__cta"
    >
      Enciclopédia na Pokédex →
    </a>
  </header>

  <nav class="museum-timeline" aria-label="Linha do tempo histórica dos jogos (1996 a 2022)">
    @for (region of regions; track region.id) {
      <button
        type="button"
        class="timeline-step"
        [class.is-active]="museum.selectedRegionId() === region.id"
        [attr.aria-pressed]="museum.selectedRegionId() === region.id"
        (click)="onSelectRegion(region.id)"
      >
        <span class="timeline-step__top">
          <span class="timeline-step__year numero-tabular">{{ region.releaseYear }}</span>
          <span class="timeline-step__gen">{{ region.generation }}</span>
        </span>
        <span class="timeline-step__name">{{ region.name }}</span>
        <span class="timeline-step__platform">{{ region.platform }}</span>
      </button>
    }
  </nav>

  <pv-museum-region-inspector (holocronRequested)="onOpenHolocron($event)" />
</section>
