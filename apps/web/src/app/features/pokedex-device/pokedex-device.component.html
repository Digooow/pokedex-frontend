<main id="conteudo-principal" class="pokedex-palco" tabindex="-1">
  <h1 id="main-heading" tabindex="-1" class="sr-only-static">
    Pokédex Interativa 3D — PokéVerse OS
  </h1>

  <section
    #aparelhoEl
    id="pokedex-aparelho"
    class="pokedex-aparelho"
    [attr.data-aberta]="store.coverOpen()"
    [class.is-animando]="rpg.isAnimating()"
    [class.is-transicionando]="rpg.isTransitioning()"
    [class.is-scanning]="isScanning()"
    [class.is-luz-ativa]="rpg.luzActive()"
    [style.--luz-x]="rpg.luzX()"
    [style.--luz-y]="rpg.luzY()"
    aria-label="Dispositivo Pokédex"
    (pointermove)="onDevicePointerMove($event)"
    (pointerleave)="rpg.resetGlint()"
    (click)="onDeviceClick($event)"
    (keydown.escape)="onDeviceEscape($event)"
  >
    <div class="pokedex-palco-3d">
      <div id="pokedex-livro" class="pokedex-livro">
        <!-- Asa direita (Base: Visor LCD + 10 Slots Azuis + Botão Amarelo Config) -->
        <div
          id="pokedex-ala-base"
          class="pokedex-ala pokedex-ala--base"
          [inert]="!store.coverOpen() && !rpg.isAnimating()"
        >
          <header class="ala-topo ala-topo--base">
            <div class="pokedex-titulo-grupo">
              <span class="hud-etiqueta-topo">PokéAPI</span>
              <h2 class="capa-titulo">Pokédex</h2>
            </div>
            <span class="saidas-som saidas-som--superior" aria-hidden="true"></span>
          </header>

          <pv-pokedex-visor
            [detailState]="store.detailState()"
            [cacheSource]="store.cacheSource()"
            [transientStatus]="transientBadge()"
            [suggestions]="store.suggestions()"
            (retry)="store.retryLastSearch()"
            (selectSuggestion)="onSelectFromVisor($event)"
            (slotOpened)="onSelectFromVisor($event)"
          />

          <div id="pokedex-rodape-direito" class="pokedex-rodape-direito">
            <fieldset
              id="grade-slots-azuis"
              class="grade-botoes-azuis controle-interativo"
              [class.is-rpg-tela-cursor]="rpg.isScreenHighlighted('slots')"
            >
              <legend class="visually-hidden">Botões azuis para gravar e selecionar Pokémon</legend>
              @for (slotIdx of slotIndices; track slotIdx) {
                @let ocupacao = getSlot(slotIdx);
                <button
                  type="button"
                  class="btn-slot-azul"
                  [attr.data-slot-index]="slotIdx"
                  [class.is-ocupado]="ocupacao !== null"
                  [class.is-ativo]="isSlotActivePokemon(slotIdx)"
                  [class.is-rpg-foco]="isSlotRpgFocused(slotIdx)"
                  [disabled]="slotsStore.busySlot() === slotIdx"
                  [attr.aria-label]="slotAriaLabel(slotIdx)"
                  [title]="slotTitle(slotIdx)"
                  (click)="onSlotClick(slotIdx, $event)"
                ></button>
              }
            </fieldset>

            <div class="mini-indicadores-inferiores">
              <button
                type="button"
                id="btn-config-slots"
                class="mini-visor-amarelo controle-interativo"
                [class.is-rpg-foco]="isSlotRpgFocused(10)"
                [attr.aria-pressed]="slotsStore.editMode()"
                aria-label="Configurar Pokémon salvos nos botões"
                title="Editar ou remover Pokémon salvos"
                (click)="toggleSlotsConfig(false, $event)"
              ></button>
              <span class="saidas-som" aria-hidden="true"></span>
            </div>
          </div>
        </div>

        <!-- Aba giratória 3D (Tampa fechada na frente + Módulo de Busca & D-Pad no verso) -->
        <div id="pokedex-aba-giratoria" class="pokedex-aba-giratoria">
          <pv-pokedex-cover
            [coverOpen]="store.coverOpen()"
            [isAnimating]="rpg.isAnimating()"
            (openRequested)="onCoverTriggerClick()"
          />

          <pv-pokedex-search-panel
            #searchPanelCmp
            (blueAdvanceOrClear)="onBlueControl()"
            (aConfirm)="onAControl()"
          />
        </div>
      </div>
    </div>
  </section>

  <pv-slot-confirm-dialog
    (openExistingRequested)="onOpenExistingFromDialog($event)"
    (overwrittenFromClick)="onOverwrittenFromDialog($event)"
  />
</main>
