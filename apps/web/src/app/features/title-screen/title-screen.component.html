<section class="start-screen" aria-labelledby="main-heading">
  <div class="start-card">
    <pv-pokeball-mark [size]="72" svgClass="start-card__emblem" />

    <span class="start-card__eyebrow">POKÉVERSE OS · EDIÇÃO CLÁSSICA</span>
    <h1 id="main-heading" tabindex="-1" pvMainHeading class="start-card__title">
      PokéVerse
    </h1>
    <p class="start-card__subtitle">
      Pressione Enter ou clique abaixo para entrar no mundo e acessar seus módulos.
    </p>

    <a routerLink="/inicio" id="btn-iniciar-jogo" class="start-card__cta">
      Iniciar Jogo
    </a>

    <span class="start-card__prompt">PRESS START</span>
  </div>
</section>
