<pv-cenarios-backdrop />

<div class="app-shell">
  <pv-hud-topbar />

  <main id="main-content" class="app-main" tabindex="-1" pvMainLandmark>
    <pv-cenarios-bar />
    <router-outlet />
  </main>

  @if (!privacy.hasSavedChoice()) {
    <pv-privacy-notice-banner />
  }

  <pv-hud-quick-dock />
</div>

@defer (when auth.visitorPrompt() !== null) {
  <pv-visitor-lock-dialog />
}

@defer (when auth.securityModalOpen()) {
  <pv-security-settings-dialog />
}

@defer (when privacy.dialogOpen()) {
  <pv-privacy-consent-dialog />
}
