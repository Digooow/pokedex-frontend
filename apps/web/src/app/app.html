<div class="pv-shell">
  <pv-hud-topbar />

  <main id="main-content" class="pv-shell__main">
    <router-outlet />
  </main>

  <pv-hud-quick-dock />

  @defer (when auth.visitorPrompt() !== null) {
    <pv-visitor-lock-dialog />
  }

  @defer (when auth.securityModalOpen()) {
    <pv-security-settings-dialog />
  }
</div>
