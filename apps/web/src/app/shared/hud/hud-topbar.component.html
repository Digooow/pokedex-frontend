<header class="hud-topbar">
  <a
    [routerLink]="[]"
    fragment="main-heading"
    class="skip-link visually-hidden"
    (click)="jumpToMainContent($event)"
  >
    Pular para o conteúdo principal
  </a>

  <div class="hud-topbar__inner">
    <div class="hud-topbar__left">
      <a routerLink="/" class="hud-brand" (click)="closeMenus()">
        <span class="hud-brand__lens" aria-hidden="true"></span>
        <span class="hud-brand__name">PokéVerse OS</span>
      </a>

      <pv-hud-modules-menu
        [open]="activeMenu() === 'modules'"
        (toggled)="toggleMenu('modules')"
        (closed)="closeMenus()"
      />
    </div>

    @if (ticker.activeNotification(); as liveEvent) {
      <p class="hud-ticker" aria-live="polite">
        <span class="hud-ticker__dot" aria-hidden="true"></span>
        <span class="hud-ticker__text">{{ liveEvent.summary }}</span>
      </p>
    }

    <div class="hud-topbar__right">
      <pv-hud-user-menu
        [open]="activeMenu() === 'user'"
        (toggled)="toggleMenu('user')"
        (closed)="closeMenus()"
      />

      <pv-hud-settings-menu
        [open]="activeMenu() === 'settings'"
        (toggled)="toggleMenu('settings')"
        (closed)="closeMenus()"
      />

      <button
        type="button"
        class="hud-pill hud-pill--cloud"
        [class.is-ok]="statusBadge().tone === 'ok'"
        [class.is-error]="statusBadge().tone === 'warn'"
        (click)="systemStatus.refresh()"
        [title]="statusBadge().title"
      >
        <span class="hud-cloud-dot" aria-hidden="true"></span>
        <span>{{ statusBadge().label }}</span>
      </button>
    </div>
  </div>
</header>
