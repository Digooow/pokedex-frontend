# SonarQube Cloud (Automatic Analysis) configuration for PokéVerse Monorepo
sonar.sources=apps,packages
sonar.sourceEncoding=UTF-8

# Test suites across monorepo workspaces
sonar.tests=apps,packages
sonar.test.inclusions=apps/**/src/**/*.spec.ts,apps/api/test/**/*.e2e-spec.ts,packages/**/src/**/*.spec.ts

# Generated Prisma PostgreSQL migrations and build outputs must not be flagged by default PL/SQL rules
sonar.exclusions=apps/api/prisma/migrations/**,**/dist/**,**/coverage/**,**/node_modules/**,**/.angular/**

# Keep unit/E2E spec fixtures self-contained without triggering copy-paste (CPD) duplication warnings
sonar.cpd.exclusions=**/*.spec.ts,**/*.e2e-spec.ts
